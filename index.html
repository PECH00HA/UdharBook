<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>UdharBook PRO - Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #f1f5f9; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  h1, h2 { color: #fbbf24; margin-bottom: 16px; }
  input, select, button { padding: 12px 14px; margin: 6px 0; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 14px; width: 100%; }
  button { cursor: pointer; background: #fbbf24; color: #000; font-weight: bold; border: none; transition: background 0.2s; }
  button:hover { background: #f59e0b; }
  button.danger { background: #ef4444; color: white; }
  button.danger:hover { background: #dc2626; }
  button.secondary { background: #334155; color: white; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .col { flex: 1; min-width: 150px; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #0f172a; border-radius: 8px; overflow: hidden; }
  th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #334155; }
  th { background: #1e293b; color: #fbbf24; }
  .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; }
  .active { background: #10b981; color: white; }
  .blocked { background: #ef4444; color: white; }
  .expired { background: #f59e0b; color: black; }
  .hidden { display: none; }
  .error { color: #ef4444; margin-top: 10px; }
  .loading { color: #fbbf24; margin-top: 10px; }
  .user-info { font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="container" id="loginScreen">
  <div class="card">
    <h1>🔐 UdharBook PRO Admin</h1>
    <p style="margin-bottom:10px; color:#94a3b8;">Enter admin email & password</p>
    <input type="email" id="email" placeholder="Admin Email" value="">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn" onclick="login()">Sign In</button>
    <p id="loginLoading" class="loading hidden">Authenticating...</p>
    <p id="loginError" class="error"></p>
  </div>
</div>

<!-- ADMIN PANEL (HIDDEN) -->
<div class="container hidden" id="adminPanel">
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <h1>💎 UdharBook PRO</h1>
        <div class="user-info" id="loggedInEmail"></div>
      </div>
      <button onclick="logout()" class="secondary" style="width:auto;">Logout</button>
    </div>
  </div>

  <!-- GENERATE LICENSE -->
  <div class="card">
    <h2>➕ Generate New License</h2>
    <div class="row">
      <div class="col">
        <label>Package Type</label>
        <select id="newPackage">
          <option value="monthly">Monthly</option>
          <option value="lifetime">Lifetime</option>
        </select>
      </div>
      <div class="col" id="monthsCol">
        <label>Months (1-12)</label>
        <select id="newMonths">
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option>
          <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        </select>
      </div>
      <div class="col">
        <label>License Key (optional)</label>
        <input type="text" id="newKey" placeholder="Auto-generated if empty">
      </div>
    </div>
    <button onclick="generateLicense()">Generate License</button>
  </div>

  <!-- LIVE CLIENTS -->
  <div class="card">
    <h2>📊 Live Clients (Active Licenses)</h2>
    <table id="liveClientsTable">
      <thead>
        <tr>
          <th>License Key</th>
          <th>Package</th>
          <th>Expiry</th>
          <th>Customers</th>
          <th>Transactions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ALL LICENSES -->
  <div class="card">
    <h2>📋 All Licenses</h2>
    <table id="licenseTable">
      <thead>
        <tr>
          <th>License Key</th>
          <th>Status</th>
          <th>Expiry Date</th>
          <th>Package</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
  // ==================== FIREBASE ====================
  const firebaseConfig = {
    apiKey: "AIzaSyBinoNV5PHLxWYjIAmezwRg2IahY6AWisU",
    authDomain: "udharbook-3e2fd.firebaseapp.com",
    databaseURL: "https://udharbook-3e2fd-default-rtdb.firebaseio.com",
    projectId: "udharbook-3e2fd",
    storageBucket: "udharbook-3e2fd.firebasestorage.app",
    messagingSenderId: "1072696547252",
    appId: "1:1072696547252:web:d210c6c39bb6db20d904e1"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const auth = firebase.auth();

  let licenses = {};
  let userStats = {};

  // ==================== UI ELEMENTS ====================
  const loginScreen = document.getElementById('loginScreen');
  const adminPanel = document.getElementById('adminPanel');
  const loginBtn = document.getElementById('loginBtn');
  const loginLoading = document.getElementById('loginLoading');
  const loginError = document.getElementById('loginError');
  const loggedInEmail = document.getElementById('loggedInEmail');

  // Toggle months based on package
  document.getElementById('newPackage').addEventListener('change', e => {
    document.getElementById('monthsCol').style.display = e.target.value === 'monthly' ? 'block' : 'none';
  });

  // ==================== AUTH HANDLERS ====================
  auth.onAuthStateChanged(user => {
    if (user) {
      // User is logged in, show panel
      showAdminPanel(user.email);
    } else {
      // User signed out
      showLoginScreen();
    }
  });

  function showAdminPanel(email) {
    loginScreen.classList.add('hidden');
    adminPanel.classList.remove('hidden');
    if (email) loggedInEmail.textContent = `Logged in: ${email}`;
    loadLicenses();  // start data listeners
  }

  function showLoginScreen() {
    loginScreen.classList.remove('hidden');
    adminPanel.classList.add('hidden');
    licenses = {};
    userStats = {};
  }

  // ==================== LOGIN ====================
  async function login() {
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('password').value.trim();
    if (!email || !pass) return;

    // UI feedback
    loginBtn.disabled = true;
    loginLoading.classList.remove('hidden');
    loginError.textContent = '';

    try {
      await auth.signInWithEmailAndPassword(email, pass);
      // onAuthStateChanged will handle showing panel
    } catch (e) {
      loginError.textContent = 'Login failed: ' + e.message;
      loginBtn.disabled = false;
      loginLoading.classList.add('hidden');
    }
    // If successful, onAuthStateChanged fires immediately, panel shown, button remains disabled (no need to re-enable)
  }

  async function logout() {
    await auth.signOut();
  }

  // ==================== LICENSE DATA ====================
  function loadLicenses() {
    db.ref('licenses').on('value', async (snap) => {
      licenses = snap.val() || {};
      await loadUserStats();
      renderAllTables();
    });
  }

  async function loadUserStats() {
    userStats = {};
    const keys = Object.keys(licenses);
    const promises = keys.map(key => {
      return db.ref('users/' + key).once('value').then(snap => {
        const data = snap.val();
        if (data) {
          userStats[key] = {
            customers: data.customers ? Object.keys(data.customers).length : 0,
            transactions: data.transactions ? data.transactions.length : 0
          };
        } else {
          userStats[key] = { customers: 0, transactions: 0 };
        }
      });
    });
    await Promise.all(promises);
  }

  function renderAllTables() {
    renderLiveClientsTable();
    renderLicenseTable();
  }

  function renderLiveClientsTable() {
    const tbody = document.querySelector('#liveClientsTable tbody');
    tbody.innerHTML = '';
    Object.entries(licenses).forEach(([key, lic]) => {
      if (getLicenseStatus(lic) !== 'active') return;
      const stats = userStats[key] || { customers: 0, transactions: 0 };
      const row = tbody.insertRow();
      row.innerHTML = `
        <td><strong>${key}</strong></td>
        <td>${lic.package_type || 'monthly'}</td>
        <td>${lic.expiry_date || 'N/A'}</td>
        <td>${stats.customers}</td>
        <td>${stats.transactions}</td>
      `;
    });
    if (tbody.innerHTML === '') {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No active clients</td></tr>';
    }
  }

  function renderLicenseTable() {
    const tbody = document.querySelector('#licenseTable tbody');
    tbody.innerHTML = '';
    Object.entries(licenses).forEach(([key, lic]) => {
      const status = getLicenseStatus(lic);
      const row = tbody.insertRow();
      row.innerHTML = `
        <td><strong>${key}</strong></td>
        <td><span class="badge ${status}">${status.toUpperCase()}</span></td>
        <td>${lic.expiry_date || 'N/A'}</td>
        <td>${lic.package_type || 'monthly'}</td>
        <td>
          <button class="secondary" onclick="toggleBlock('${key}')">${status==='blocked'?'Unblock':'Block'}</button>
          <button onclick="openRenew('${key}')">Renew</button>
          <button class="danger" onclick="deleteLicense('${key}')">Delete</button>
        </td>
      `;
    });
  }

  function getLicenseStatus(lic) {
    if (lic.status === 'blocked') return 'blocked';
    if (!lic.expiry_date) return 'expired';
    const today = new Date().toISOString().slice(0,10);
    if (lic.package_type === 'lifetime') return 'active';
    if (lic.expiry_date >= today) return 'active';
    return 'expired';
  }

  function generateKey() {
    return 'UB-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  }

  async function generateLicense() {
    const pkg = document.getElementById('newPackage').value;
    const months = parseInt(document.getElementById('newMonths').value);
    const customKey = document.getElementById('newKey').value.trim();
    const key = customKey || generateKey();

    if (licenses[key]) return alert('License key already exists!');

    let expiry;
    if (pkg === 'lifetime') {
      expiry = '2099-12-31';
    } else {
      const d = new Date();
      d.setMonth(d.getMonth() + months);
      expiry = d.toISOString().slice(0,10);
    }

    await db.ref('licenses/' + key).set({
      status: 'active',
      expiry_date: expiry,
      package_type: pkg,
      created_at: new Date().toISOString()
    });

    document.getElementById('newKey').value = '';
    alert('✅ License generated: ' + key);
  }

  async function toggleBlock(key) {
    const lic = licenses[key];
    if (!lic) return;
    const newStatus = lic.status === 'blocked' ? 'active' : 'blocked';
    await db.ref('licenses/' + key + '/status').set(newStatus);
  }

  function openRenew(key) {
    const lic = licenses[key];
    if (!lic) return;
    const input = prompt('Enter months to extend (1-12) or "lifetime" for lifetime', '1');
    if (!input) return;
    if (input.toLowerCase() === 'lifetime') {
      db.ref('licenses/' + key).update({
        expiry_date: '2099-12-31',
        package_type: 'lifetime',
        status: 'active'
      });
    } else {
      const m = parseInt(input);
      if (isNaN(m) || m < 1 || m > 12) return alert('Invalid months');
      const currentExpiry = lic.expiry_date || new Date().toISOString().slice(0,10);
      const d = new Date(currentExpiry);
      d.setMonth(d.getMonth() + m);
      db.ref('licenses/' + key).update({
        expiry_date: d.toISOString().slice(0,10),
        status: 'active'
      });
    }
  }

  async function deleteLicense(key) {
    if (confirm('⚠️ Delete license ' + key + '? This cannot be undone.')) {
      await db.ref('licenses/' + key).remove();
    }
  }

  // Ensure months dropdown is visible initially for 'monthly'
  document.getElementById('monthsCol').style.display = 'block';
</script>
</body>
</html>
